[workspace]
resolver = "2"
members = ["crates/kb-net", "crates/kb-engine", "crates/kb-js", "crates/kb-app", "crates/kb-desktop", "crates/kb-kindle"]
exclude = ["spike"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
blitz-html = "=0.3.0-beta.4"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "woff", "file-input"] }
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender_vello_cpu = "0.18"
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
png = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "cookies", "json"] }
libc = "0.2"

[profile.release]
opt-level = 3
debug = false

# The vendored rquickjs-sys reuses its ARMv7 bindings on musl (see vendor/README.md).
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys-0.14.0" }
# blitz-dom: guards for stylesheets and messages that arrive after a node was removed (see vendor/README.md).
blitz-dom = { path = "vendor/blitz-dom-0.3.0-beta.4" }
